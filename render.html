<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Render surface — Help Me Breathe</title>
    <meta name="description" content="Internal capture surface. Renders one breathing circle at a fixed size so a headless browser can record short clips and pin stills.">

    <!--
      RENDER SURFACE (noindex).

      This page exists so tools/render/render-short.mjs can point a headless
      Chromium at a known viewport and record the breathing circle. It is not a
      public page, it is never linked from the site, and it must never be
      indexed or shared.

      Query parameters
      ----------------
        technique=478|box|coherent|sigh|extended|triangle|wim   (also accepts a
                  page slug such as "box-breathing"; alias: t=)
        size=story|pin|square      1080x1920 | 1000x1500 | 1080x1080
        caption=<text>             large calm headline above the circle,
                                   trimmed to 80 characters
        sub=<text>                 one small line below the circle
        theme=478|box|coherent|sigh|extended|triangle|wim
                                   overrides the technique's own palette
        autostart=1                begin the session as soon as the page loads
                                   (on by default; autostart=0 turns it off)
        phrase=0                   hide the engine's phase sentence under the
                                   circle ("Breathe in slowly…"), leaving only
                                   the sub line. On by default.
        loop=1                     restart the session when it finishes
        d=<seconds>                session length; -1 (default here) = unlimited

      Caption and sub are written with textContent, so anything in the query
      string is inert text — never markup.

      Third-party requests: Google Fonts only. No analytics, no consent script,
      no ads, no Pro modules. Keep it that way; a capture surface that phones
      home would put a tracker inside every clip we publish.
    -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='24' font-size='24'>🫁</text></svg>">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">

    <meta name="theme-color" content="#8b5cf6">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/css/styles.css">
    <!-- Render-blocking on purpose: the capture must not start before Quicksand is ready. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap">

    <style>
        /* ------------------------------------------------------------------
           Render surface layout.

           Everything here is scoped to body.render-body so it can never leak
           into the real site if this file is ever copied. Sizes are absolute
           pixels, not viewport units: the recorder fixes the viewport, and a
           fixed pixel layout renders identically at every capture.
           ------------------------------------------------------------------ */
        html,
        body.render-body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body.render-body {
            background-attachment: scroll;
            -webkit-font-smoothing: antialiased;
        }

        /* Per-size scale. story = 1080x1920, pin = 1000x1500, square = 1080x1080. */
        body.render-story {
            --r-circle: 640px;
            --r-container: 900px;
            --r-caption: 68px;
            --r-caption-max: 900px;
            --r-sub: 32px;
            --r-phase: 34px;
            --r-circle-text: 62px;
            --r-wordmark: 26px;
            --r-gap: 56px;
        }

        body.render-pin {
            --r-circle: 520px;
            --r-container: 720px;
            --r-caption: 60px;
            --r-caption-max: 820px;
            --r-sub: 29px;
            --r-phase: 31px;
            --r-circle-text: 52px;
            --r-wordmark: 24px;
            --r-gap: 44px;
        }

        body.render-square {
            --r-circle: 430px;
            --r-container: 600px;
            --r-caption: 52px;
            --r-caption-max: 860px;
            --r-sub: 26px;
            --r-phase: 28px;
            --r-circle-text: 44px;
            --r-wordmark: 22px;
            --r-gap: 32px;
        }

        .render-main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            max-width: none;
        }

        /* The engine adds .kiosk to the section; these win on specificity. */
        body.render-body .breathing-section,
        body.render-body .breathing-section.kiosk {
            background: none;
            border: 0;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-radius: 0;
            margin: 0;
            padding: 0 5%;
            max-width: none;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Chrome that has no place in a capture. */
        body.render-body .settings-btn,
        body.render-body .settings-panel,
        body.render-body .controls,
        body.render-body .session-stats,
        body.render-body .progress-bar,
        body.render-body .session-info,
        body.render-body .technique-info,
        body.render-body .safety-ack,
        body.render-body [data-slot],
        body.render-body .technique-buttons,
        body.render-body .keyboard-hint,
        body.render-body [data-role="timer"],
        body.render-body footer,
        body.render-body .site-footer,
        /* js/app.js -> js/analytics.js -> js/consent.js builds this banner on
           import. Nothing here is ever consented to or tracked, but the banner
           would otherwise sit in the bottom of every capture. */
        body.render-body #cookieConsent {
            display: none !important;
        }

        /* Kept in the accessibility tree (the section is labelled by it), off screen. */
        body.render-body [data-role="technique-title"] {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            border: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .render-caption {
            font-size: var(--r-caption);
            font-weight: 300;
            line-height: 1.18;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            max-width: var(--r-caption-max);
            margin: 0 0 var(--r-gap);
            text-wrap: balance;
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
        }

        .render-caption:empty {
            display: none;
        }

        body.render-body .breathing-container {
            width: var(--r-container);
            height: var(--r-container);
            margin: 0;
            flex: none;
            /* styles.css sets `contain: layout style paint` for scroll
               performance. Paint containment clips the circle's glow to the
               container box, which shows up as a hard rectangle in a still. */
            contain: none;
        }

        body.render-body .breathing-circle {
            width: var(--r-circle);
            height: var(--r-circle);
            box-shadow: 0 0 140px var(--theme-glow), 0 0 48px rgba(255, 255, 255, 0.28);
        }

        body.render-body [data-role="circle-text"] {
            font-size: var(--r-circle-text);
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        body.render-body [data-role="breathing-text"] {
            font-size: var(--r-phase);
            font-weight: 400;
            line-height: 1.4;
            color: var(--text-secondary);
            background: none;
            border: 0;
            box-shadow: none;
            padding: 0;
            margin: var(--r-gap) 0 0;
            max-width: var(--r-caption-max);
            min-height: 1.4em;
        }

        /* styles.css gives .breathing-text an explicit display, which beats the
           UA rule for [hidden]. ?phrase=0 sets the attribute; this honours it. */
        body.render-body [data-role="breathing-text"][hidden] {
            display: none !important;
        }

        .render-sub {
            font-size: var(--r-sub);
            font-weight: 400;
            line-height: 1.4;
            color: var(--text-secondary);
            opacity: 0.92;
            margin: calc(var(--r-gap) * 0.5) 0 0;
            max-width: var(--r-caption-max);
        }

        .render-sub:empty {
            display: none;
        }

        .render-wordmark {
            font-size: var(--r-wordmark);
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: lowercase;
            color: var(--text-secondary);
            opacity: 0.7;
            margin: calc(var(--r-gap) * 1.4) 0 0;
        }

        /* The recorder never scrolls, so nothing may sit outside the viewport. */
        body.render-body .nature-bg {
            opacity: 0.45;
        }
    </style>
</head>
<body class="render-body render-story theme-478" data-lock-theme data-no-ads="true" data-no-asks="true">

    <div class="nature-bg"></div>

    <!-- Theme-specific natural elements, same set and class names as index.html. -->
    <div class="natural-element star star-1"></div>
    <div class="natural-element star star-2"></div>
    <div class="natural-element star star-3"></div>
    <div class="natural-element star star-4"></div>

    <div class="natural-element leaf leaf-1"></div>
    <div class="natural-element leaf leaf-2"></div>
    <div class="natural-element leaf leaf-3"></div>

    <div class="natural-element ripple ripple-1"></div>
    <div class="natural-element ripple ripple-2"></div>
    <div class="natural-element ripple ripple-3"></div>

    <div class="natural-element cloud cloud-1"></div>

    <div class="natural-element sun-ray sun-ray-1"></div>
    <div class="natural-element sun-ray sun-ray-2"></div>
    <div class="natural-element sun-ray sun-ray-3"></div>

    <main class="render-main">

        <section class="breathing-section"
                 data-breathing-app
                 data-kiosk
                 data-autostart
                 data-lock-technique
                 data-technique="478"
                 data-duration="-1"
                 aria-labelledby="timer-heading">

            <div class="settings-panel" data-role="settings-panel" hidden>
                <div class="setting-item">
                    <span class="setting-label" id="label-sound">Sound</span>
                    <div class="toggle-switch" data-role="sound-toggle" role="button" tabindex="-1" aria-pressed="false" aria-labelledby="label-sound"></div>
                </div>
                <div class="setting-item">
                    <span class="setting-label" id="label-vibration">Vibration</span>
                    <div class="toggle-switch" data-role="vibration-toggle" role="button" tabindex="-1" aria-pressed="false" aria-labelledby="label-vibration"></div>
                </div>
                <div class="setting-item">
                    <label class="setting-label" for="session-duration">Session length</label>
                    <select id="session-duration" class="duration-select" data-role="duration-select">
                        <option value="180">3 minutes</option>
                        <option value="300">5 minutes</option>
                        <option value="600">10 minutes</option>
                        <option value="-1" selected>Unlimited</option>
                    </select>
                </div>
            </div>

            <h1 class="render-caption" data-role="render-caption">Breathe with me for a minute</h1>

            <h2 id="timer-heading" data-role="technique-title">Guided breathing</h2>

            <div class="breathing-container">
                <div class="breathing-aura"></div>
                <div class="breathing-circle technique-478" data-role="circle">
                    <div class="circle-text-container">
                        <span data-role="circle-text">Ready</span>
                    </div>
                </div>
            </div>

            <p class="breathing-text" data-role="breathing-text"></p>

            <div class="session-info" data-role="session-info" style="display: none;">
                <div class="session-progress">
                    <div class="session-progress-fill" data-role="session-progress-fill"></div>
                </div>
                <div class="session-time-remaining" data-role="session-time-remaining"></div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" data-role="progress-fill"></div>
                <div class="progress-time" data-role="progress-time"></div>
            </div>

            <div class="timer" data-role="timer">00:00</div>

            <div class="session-stats" data-role="stats" style="display: none;">
                <div class="stat-item">
                    <span class="stat-value" data-role="breath-count">0</span>
                    <span class="stat-label">Breaths</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" data-role="avg-breath">0s</span>
                    <span class="stat-label">Avg. breath</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" data-role="session-progress">0%</span>
                    <span class="stat-label">Progress</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" type="button" data-role="start" data-action="start">Begin</button>
                <button class="control-btn" type="button" data-role="pause" data-action="pause" disabled>Pause</button>
                <button class="control-btn" type="button" data-role="stop" data-action="stop" disabled>Stop</button>
            </div>

            <!-- Both slots are required by docs/PAGE_CONTRACT.md on any page with a
                 timer. Nothing fills them here (no Pro modules are loaded) and the
                 chrome rule above hides [data-slot] outright, so they cost nothing
                 and no card can ever land inside a capture. -->
            <div class="tools-row" data-slot="tools"></div>
            <div data-slot="post-session"></div>

            <div class="safety-ack" data-role="safety-ack" hidden>
                <h3>Read this before you start this pattern</h3>
                <div data-role="safety-ack-body"></div>
                <div class="safety-ack-actions">
                    <button class="control-btn" type="button" data-action="safety-ack-confirm">I understand, begin</button>
                    <button class="control-btn" type="button" data-action="safety-ack-cancel">Not now</button>
                </div>
            </div>

            <p class="render-sub" data-role="render-sub"></p>

            <p class="render-wordmark">helpmebreath.com</p>

            <p class="live-region" data-role="live-region" aria-live="polite" aria-atomic="true"></p>
        </section>

    </main>

    <script>
    /*
     * Configuration. This is a classic inline script on purpose: it must finish
     * before /js/app.js (a module, therefore deferred) auto-initialises the
     * timer, because the engine reads data-technique / data-duration and the
     * ?t= / ?d= query at init time.
     */
    (function configureRenderSurface() {
        'use strict';

        var TECHNIQUE_KEYS = ['478', 'box', 'coherent', 'sigh', 'extended', 'triangle', 'wim'];

        // Page slug -> technique key, so a batch job can name either one.
        var SLUG_TO_KEY = {
            '4-7-8-breathing': '478',
            '4-7-8': '478',
            'box-breathing': 'box',
            'heart-coherence-breathing': 'coherent',
            'coherent-breathing': 'coherent',
            'cyclic-sighing': 'sigh',
            'extended-exhale-breathing': 'extended',
            'triangle-breathing': 'triangle',
            'energizing-breath': 'wim',
            'energizing-breathing': 'wim'
        };

        var SIZES = { story: 'render-story', pin: 'render-pin', square: 'render-square' };

        var params;
        try {
            params = new URLSearchParams(window.location.search);
        } catch (err) {
            params = { get: function () { return null; } };
        }

        function param(name) {
            var value = params.get(name);
            return typeof value === 'string' ? value.trim() : '';
        }

        function truthy(name, fallback) {
            var value = param(name);
            if (!value) return fallback;
            return !/^(0|false|no|off)$/i.test(value);
        }

        function resolveTechnique(raw) {
            var value = String(raw || '').trim().toLowerCase();
            if (!value) return '';
            if (TECHNIQUE_KEYS.indexOf(value) !== -1) return value;
            if (Object.prototype.hasOwnProperty.call(SLUG_TO_KEY, value)) return SLUG_TO_KEY[value];
            return '';
        }

        var body = document.body;
        var section = document.querySelector('[data-breathing-app]');
        var circle = document.querySelector('[data-role="circle"]');
        var captionEl = document.querySelector('[data-role="render-caption"]');
        var subEl = document.querySelector('[data-role="render-sub"]');

        /* --- size ------------------------------------------------------- */
        var size = param('size').toLowerCase();
        if (!Object.prototype.hasOwnProperty.call(SIZES, size)) size = 'story';
        body.classList.remove('render-story', 'render-pin', 'render-square');
        body.classList.add(SIZES[size]);
        body.setAttribute('data-render-size', size);

        /* --- technique --------------------------------------------------- */
        var technique = resolveTechnique(param('technique') || param('t'));
        if (technique && section) {
            section.setAttribute('data-technique', technique);
            if (circle) {
                circle.className = 'breathing-circle technique-' + technique;
            }
        }
        var activeKey = technique || (section ? section.getAttribute('data-technique') : '478') || '478';

        /* --- theme ------------------------------------------------------- */
        var themeKey = resolveTechnique(param('theme').replace(/^theme-/, '')) || activeKey;
        TECHNIQUE_KEYS.forEach(function (key) { body.classList.remove('theme-' + key); });
        body.classList.add('theme-' + themeKey);

        /* --- caption + sub ----------------------------------------------- */
        var caption = param('caption').slice(0, 80);
        if (captionEl) captionEl.textContent = caption;          // textContent: never markup
        var sub = param('sub').slice(0, 120);
        if (subEl) subEl.textContent = sub;
        if (caption) document.title = caption + ' — Help Me Breathe';

        /* --- phase sentence ---------------------------------------------- */
        if (!truthy('phrase', true)) {
            var phraseEl = document.querySelector('[data-role="breathing-text"]');
            if (phraseEl) phraseEl.hidden = true;
        }

        /* --- autostart / duration ---------------------------------------- */
        var autostart = truthy('autostart', true);
        if (section) {
            if (autostart) section.setAttribute('data-autostart', '');
            else section.removeAttribute('data-autostart');
        }

        /*
         * The engine resolves duration as query.d -> options -> saved settings ->
         * data-duration. A stale hmb.settings in localStorage would otherwise win
         * over data-duration, so put the render default in the query itself and
         * leave the visitor's stored settings untouched.
         */
        try {
            var url = new URL(window.location.href);
            var changed = false;
            if (!url.searchParams.get('d')) { url.searchParams.set('d', '-1'); changed = true; }
            if (technique && url.searchParams.get('t') !== technique) {
                url.searchParams.set('t', technique);
                changed = true;
            }
            if (changed) window.history.replaceState(null, '', url.toString());
        } catch (err) { /* file:// or an exotic URL — the data attributes still apply */ }

        /* --- a marker the recorder can wait on --------------------------- */
        body.setAttribute('data-render-ready', 'config');
    }());
    </script>

    <script type="module" src="/js/app.js"></script>

    <script type="module">
    /*
     * Loop support and a capture-ready flag.
     *
     * `loop=1` restarts the session when it finishes or is stopped. With the
     * default d=-1 the session is unlimited and never completes, so this only
     * matters when a job passes an explicit length.
     */
    import { getApp } from '/js/app.js';

    const params = new URLSearchParams(window.location.search);
    const raw = (params.get('loop') || '').trim();
    const loop = raw !== '' && !/^(0|false|no|off)$/i.test(raw);
    const root = document.querySelector('[data-breathing-app]');

    document.addEventListener('hmb:ready', () => {
        document.body.setAttribute('data-render-ready', 'true');
    });

    /*
     * Font readiness.
     *
     * Quicksand comes from Google Fonts. A machine with no network still paints
     * the page, just in a system sans-serif, and a whole batch can come out in
     * the wrong typeface without anyone noticing. Report what actually loaded in
     * data-render-font so render-short.mjs can warn, and hold the capture flag
     * until the fonts have settled either way — with a 4s ceiling, because a
     * font that never resolves must not stall the recorder.
     */
    async function fontState() {
        const timeout = new Promise((resolve) => window.setTimeout(() => resolve('timeout'), 4000));
        try {
            const settled = await Promise.race([document.fonts.ready.then(() => 'ready'), timeout]);
            if (settled === 'timeout') return 'timeout';
            return document.fonts.check('300 68px Quicksand') ? 'quicksand' : 'fallback';
        } catch (err) {
            return 'unknown';
        }
    }

    /* The circle only animates once the engine adds .active — that is the real
       "the clip can start now" signal, so expose it as its own flag. */
    document.addEventListener('hmb:session-start', async () => {
        document.body.setAttribute('data-render-font', await fontState());
        document.body.setAttribute('data-render-running', 'true');
    }, { once: true });

    /*
     * Safety acknowledgement.
     *
     * Techniques with `requiresSafetyAck` (today: the energizing breath) show
     * an acknowledgement panel instead of starting, and there is nobody at a
     * capture surface to tap it. Confirm it on their behalf — the panel is
     * hidden here, but the click still reaches the engine's delegated handler.
     *
     * Confirming makes the engine write hmb.ack.<key> to localStorage. We take
     * that key straight back out again — but only if it was not already there
     * when the page loaded, so a real acknowledgement made in this browser is
     * left alone. Opening /render therefore cannot silently pre-acknowledge the
     * published /energizing-breath page for a real visitor. Playwright throws
     * its context away after every job, so in the render tool nothing persists
     * at all; this matters only when a human opens /render by hand.
     *
     * The watchdog runs for the life of the page rather than giving up after a
     * few tries, so a looped session that meets the panel again is confirmed
     * again.
     */
    const ACK_PREFIX = 'hmb.ack.';

    const preexistingAck = new Set();
    try {
        for (const key of Object.keys(window.localStorage)) {
            if (key.startsWith(ACK_PREFIX)) preexistingAck.add(key);
        }
    } catch (err) { /* storage unavailable — nothing can be written either */ }

    function forgetAckFlags() {
        try {
            for (const key of Object.keys(window.localStorage)) {
                if (key.startsWith(ACK_PREFIX) && !preexistingAck.has(key)) {
                    window.localStorage.removeItem(key);
                }
            }
        } catch (err) { /* nothing to clean up */ }
    }

    window.setInterval(() => {
        const panel = document.querySelector('[data-role="safety-ack"]');
        if (!panel || panel.hidden) return;
        const confirmBtn = panel.querySelector('[data-action="safety-ack-confirm"]');
        if (confirmBtn) confirmBtn.click();
        forgetAckFlags();
    }, 300);

    window.addEventListener('pagehide', forgetAckFlags);

    if (loop) {
        const restart = () => {
            if (!root) return;
            const app = getApp(root);
            if (!app) return;
            window.setTimeout(() => {
                if (!app.getState().running) app.start();
            }, 400);
        };
        document.addEventListener('hmb:session-complete', restart);
        document.addEventListener('hmb:session-stop', restart);
    }
    </script>

</body>
</html>
